<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VITM Digital Twin Exhibit</title>
  <!-- Load Google's Model-Viewer Component -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    body { margin: 0; background-color: #111; color: #fff; font-family: sans-serif; text-align: center; }
    model-viewer { width: 100vw; height: 80vh; }
    .btn { padding: 12px 24px; background: #007bff; color: white; border: none; border-radius: 6px; font-weight: bold; }
  </style>
</head>
<body>
  <h2>VITM Interactive Exhibit: Digital Twin</h2>
  
  <!-- Direct 3D Model Renderer -->
  <model-viewer src="leo_rover.glb" ar ar-modes="webxr scene-viewer quick-look" camera-controls auto-rotate shadow-intensity="1">
    <button slot="ar-button" class="btn">View in Your Space (AR)</button>
  </model-viewer>

  <p>Rotate & Inspect CAD Assembly</p>
</body>
</html>
