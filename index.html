<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VITM Digital Twin Exhibit</title>
  <!-- Load Google's Model-Viewer Component -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #111; color: #fff; font-family: sans-serif; text-align: center; overflow: hidden; }
    h2 { position: absolute; top: 15px; width: 100%; z-index: 10; font-size: 1.2rem; }
    p { position: absolute; bottom: 15px; width: 100%; z-index: 10; font-size: 0.9rem; opacity: 0.8; }
    model-viewer { width: 100vw; height: 100vh; }
    .btn { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); z-index: 10; padding: 12px 24px; background: #007bff; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <h2>VITM Interactive Exhibit: Digital Twin</h2>
  
  <!-- Direct 3D Model Renderer with Zoom & Scale Fixes -->
  <model-viewer src="leo_rover.glb" ar ar-modes="webxr scene-viewer quick-look" camera-controls auto-rotate bounds="tight" field-of-view="30deg" shadow-intensity="1">
    <button slot="ar-button" class="btn">View in Your Space (AR)</button>
  </model-viewer>

  <p>Rotate & Inspect CAD Assembly</p>
</body>
</html>
